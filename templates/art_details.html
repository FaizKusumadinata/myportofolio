<!DOCTYPE html>
{% extends "base.html" %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Art Details - {{name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{% block content %}
        <main>
        <section class="art-detail-section">
            <div class="detail-grid-container">

                <div class="detail-grid">
                    <h1 class="art-detail-title">{{art_detail.title}}</h1>
                    <p class="art-detail-date">Posted On: {{art_detail.date_posted}}</p>
                    <p class="art-detail-description">{{art_detail.description}}</p>
                </div>
                <div class = "art-grid">
                    <img class="art-detail-image" src="{{art_detail.art_image}}">
                </div>

            </div>
        </section>

    </main>
{% endblock content %}
</body>
</html>
