<form method="post" action="{% url 'main:toggle_star_artwork' art_detail.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in art_detail.starred_by.all %} is-starred{% endif %}"
            title="{% if art_detail.starred_by.all %}Starred By {{ art_detail.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in art_detail.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ art_detail.starred_by.count }}</span>
    </button>
</form>
