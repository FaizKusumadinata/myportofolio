<p class="experience-status">
    <button type="button"
            class="button"
            popovertarget="delete-project-{{ art_detail.id }}"
            aria-label="Hapus {{ art_detail.title }}"
            title="Hapus proyek">
        Delete Artwork
    </button>
</p>
<div id="delete-project-{{ art_detail.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ art_detail.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ art_detail.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ art_detail.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-project-title-{{ art_detail.id }}">Delete Artwork?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ art_detail.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                popovertarget="delete-project-{{ art_detail.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_artwork' art_detail.id %}">
                {% csrf_token %}
                <button type="submit" class="button">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
